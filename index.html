<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Ghouls 'N Ghosts MD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #373737;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== CONSOLA ===== */
  #console-container {
    position: relative;
    height: 100vh;
    width: 177.78vh;
    max-width: 100vw;
    max-height: 56.25vw;
  }
  #skin {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    object-fit: contain;
  }
  #emulator-wrapper {
    position: absolute;
    left: 18.31%; top: 10.11%;
    width: 63.37%; height: 70.23%;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
    z-index: 2;
  }
  #emulator-wrapper canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  /* ===== BOTONES TRANSPARENTES ===== */
  .ctrl-btn {
    position: absolute;
    z-index: 100;
    border: none;
    background: transparent;
    cursor: pointer;
    pointer-events: auto;
    touch-action: none;
    outline: none;
  }
  #btn-up    { left: 6.47%; top: 20.64%; width: 4.50%; height: 7.92%; border-radius: 20%; }
  #btn-down  { left: 6.71%; top: 36.31%; width: 4.27%; height: 6.39%; border-radius: 20%; }
  #btn-left  { left: 2.02%; top: 28.89%; width: 4.47%; height: 7.14%; border-radius: 20%; }
  #btn-right { left: 10.94%; top: 29.03%; width: 4.16%; height: 6.17%; border-radius: 20%; }
  #btn-a { left: 89.47%; top: 36.89%; width: 4.50%; height: 7.11%; border-radius: 50%; }
  #btn-b { left: 94.06%; top: 28.19%; width: 4.66%; height: 6.56%; border-radius: 50%; }
  #btn-x { left: 84.88%; top: 28.75%; width: 4.34%; height: 7.25%; border-radius: 50%; }
  #btn-y { left: 89.16%; top: 20.89%; width: 4.58%; height: 6.83%; border-radius: 50%; }
  #stick-left  { left: 7.47%; top: 57.31%; width: 6.08%; height: 10.03%; border-radius: 50%; }
  #stick-right { left: 86.61%; top: 56.89%; width: 6.39%; height: 10.44%; border-radius: 50%; }
  #btn-menu   { left: 22.58%; top: 85.36%; width: 4.91%; height: 4.06%; border-radius: 40%; }
  #btn-tate   { left: 28.81%; top: 85.36%; width: 4.98%; height: 3.78%; border-radius: 40%; }
  #btn-select { left: 66.13%; top: 85.64%; width: 4.98%; height: 3.92%; border-radius: 40%; }
  #btn-start  { left: 72.36%; top: 85.50%; width: 4.67%; height: 3.92%; border-radius: 40%; }

  /* ===== PANTALLAS DE INTRO ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: #373737;
    z-index: 9000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }
  .overlay.oculto { display: none !important; }
  .rotate-box {
    background: #222;
    border: 2px solid #ff4444;
    border-radius: 16px;
    padding: 30px 40px;
    max-width: 420px;
    color: #fff;
    transition: transform .3s;
  }
  .rotate-icon { font-size: 58px; margin-bottom: 14px; }
  .rotate-box p { font-size: 18px; margin-bottom: 20px; line-height: 1.4; }
  .btn-rojo {
    background: #ff4444;
    color: #000;
    border: none;
    padding: 14px 34px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
  }

  @media (orientation: portrait) {
    #console-container { visibility: hidden; }
    .rotate-box { transform: rotate(90deg); }
    #btn-fullscreen { transform: rotate(90deg); }
  }

  /* ===== BOTÓN MAPEO ===== */
  #btn-mapper {
    position: fixed; left: 6px; bottom: 6px; z-index: 9500;
    background: rgba(0,0,0,.35); color: #fff; border: 1px solid #666;
    border-radius: 6px; padding: 5px 9px; font-size: 13px; cursor: pointer;
  }

  /* ===== PANEL DE MAPEO (Ajustado a la pantalla del emulador) ===== */
  #map-panel {
    position: absolute;
    left: 18.31%;
    top: 10.11%;
    width: 63.37%;
    height: 70.23%;
    z-index: 9600;
    background: rgba(15, 15, 15, 0.97);
    border: 2px solid #ff4444;
    border-radius: 4px;
    color: #fff;
    display: none;
    flex-direction: column;
    padding: 12px 16px;
    box-shadow: 0 0 20px rgba(0,0,0,0.9);
    backdrop-filter: blur(4px);
    overflow: hidden;
  }
  #map-panel.abierto { display: flex; }
  #map-panel h3 {
    color: #ff4444; margin: 0 0 8px 0; font-size: 14px;
    text-align: center; border-bottom: 1px solid #444; padding-bottom: 6px;
    letter-spacing: 1px; flex-shrink: 0;
  }
  #map-list {
    flex: 1; overflow-y: auto; margin: 6px 0; padding-right: 6px;
    min-height: 0;
  }
  #map-list::-webkit-scrollbar { width: 6px; }
  #map-list::-webkit-scrollbar-thumb { background: #ff4444; border-radius: 3px; }

  .map-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 6px; padding: 4px 2px; border-bottom: 1px solid #2a2a2a; font-size: 11px;
  }
  .map-row select {
    background: #111; color: #0f0; border: 1px solid #555;
    padding: 3px 6px; border-radius: 3px; font-size: 10px; min-width: 110px;
  }
  .map-actions {
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 6px;
    flex-shrink: 0;
  }
  .map-actions button {
    background: #ff4444; color: #000; border: none; padding: 6px 10px;
    font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 10px;
  }
  .map-actions button.gris { background: #555; color: #fff; }
  #map-out {
    width: 100%; height: 30px; margin-top: 6px; background: #000; color: #0f0;
    border: 1px solid #333; font-family: monospace; font-size: 9px; padding: 3px;
    border-radius: 3px; resize: none; flex-shrink: 0;
  }

  /* ===== OCULTAR CONTROLES NATIVOS ===== */
  .ejs_dpad, .ejs_dpad_container, .ejs_button, .ejs_button_container, .ejs_gamepad,
  .ejs_touchControls, .ejs_controlBtn, .ejs_virtualGamepad, .ejs_volumeBtn {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
    width: 0 !important;
    height: 0 !important;
  }
</style>
</head>
<body>

<div id="console-container">
  <img id="skin" src="skin1.png" alt="NEXUS">
  <div id="emulator-wrapper"></div>
  <button class="ctrl-btn" id="btn-up"></button>
  <button class="ctrl-btn" id="btn-down"></button>
  <button class="ctrl-btn" id="btn-left"></button>
  <button class="ctrl-btn" id="btn-right"></button>
  <button class="ctrl-btn" id="btn-a"></button>
  <button class="ctrl-btn" id="btn-b"></button>
  <button class="ctrl-btn" id="btn-x"></button>
  <button class="ctrl-btn" id="btn-y"></button>
  <button class="ctrl-btn" id="stick-left"></button>
  <button class="ctrl-btn" id="stick-right"></button>
  <button class="ctrl-btn" id="btn-menu"></button>
  <button class="ctrl-btn" id="btn-tate"></button>
  <button class="ctrl-btn" id="btn-select"></button>
  <button class="ctrl-btn" id="btn-start"></button>
</div>

<div id="ov-rotate" class="overlay">
  <div class="rotate-box">
    <div class="rotate-icon">📱➡️</div>
    <p>Este juego se juega en <b>horizontal</b>.<br>Gira el dispositivo.</p>
    <button class="btn-rojo" id="btn-rotate-ok">¡Entendido!</button>
  </div>
</div>

<div id="ov-full" class="overlay oculto">
  <button class="btn-rojo" id="btn-fullscreen">⛶ PANTALLA COMPLETA</button>
</div>

<button id="btn-mapper">⚙</button>

<div id="map-panel">
  <h3>⚙ MAPEO DE BOTONES</h3>
  <div id="map-list"></div>
  <div class="map-actions">
    <button id="map-save">💾 GUARDAR</button>
    <button id="map-copy" class="gris">📋 COPIAR MAPA</button>
    <button id="map-reset" class="gris">🔄 POR DEFECTO</button>
    <button id="map-close" class="gris">✖ CERRAR</button>
  </div>
  <textarea id="map-out" readonly></textarea>
</div>

    return window.innerWidth > window.innerHeight;
  }
  function actualizarPantallas(){
    if(yaIniciado) return;
    if(esHorizontal()){
      ovRotate.classList.add('oculto');
      ovFull.classList.remove('oculto');
    }else{
      ovRotate.classList.remove('oculto');
      ovFull.classList.add('oculto');
    }
  }
  actualizarPantallas();
  window.addEventListener('resize', actualizarPantallas);
  window.addEventListener('orientationchange', function(){ setTimeout(actualizarPantallas, 100); });

  document.getElementById('btn-rotate-ok').addEventListener('click', function(){
    ovRotate.classList.add('oculto');
    ovFull.classList.remove('oculto');
  });

  document.getElementById('btn-fullscreen').addEventListener('click', function(){
    var d = document.documentElement;
    try{
      if(d.requestFullscreen) d.requestFullscreen();
      else if(d.webkitRequestFullscreen) d.webkitRequestFullscreen();
    }catch(e){}
    if(screen.orientation && screen.orientation.lock){
      try{ screen.orientation.lock('landscape'); }catch(e){}
    }
    yaIniciado = true;
    ovFull.classList.add('oculto');
  });

  /* ===== MAPEO ===== */
  var ENTRADAS = [
    [-1,"— Ninguno —"],
    [0,"0 · B (Fuego 1)"],
    [8,"8 · A (Fuego 2)"],
    [1,"1 · Y"],
    [9,"9 · X"],
    [10,"10 · L"],
    [11,"11 · R"],
    [12,"12 · L2"],
    [13,"13 · R2"],
    [2,"2 · SELECT"],
    [3,"3 · START (Pausa)"],
    [4,"4 · ARRIBA"],
    [5,"5 · ABAJO"],
    [6,"6 · IZQUIERDA"],
    [7,"7 · DERECHA"],
    [14,"14 · L3"],
    [15,"15 · R3"]
  ];

  var BOTONES = [
    ["btn-up","Arriba"],["btn-down","Abajo"],
    ["btn-left","Izquierda"],["btn-right","Derecha"],
    ["btn-a","Botón A"],["btn-b","Botón B"],
    ["btn-x","Botón X"],["btn-y","Botón Y"],
    ["stick-left","Stick izq."],["stick-right","Stick der."],
    ["btn-menu","MENU"],["btn-tate","TATE"],
    ["btn-select","SELECT"],["btn-start","START"]
  ];

  var POR_DEFECTO = {
    "btn-up":4,"btn-down":5,"btn-left":6,"btn-right":7,
    "btn-a":0,"btn-b":8,"btn-x":0,"btn-y":8,
    "stick-left":0,"stick-right":8,
    "btn-menu":3,"btn-tate":3,"btn-select":2,"btn-start":3
  };

  var CLAVE = "nexus_mapa_" + EJS_core;
  var mapa = {};

  function cargarMapa(){
    var guardado = null;
    try{ guardado = JSON.parse(localStorage.getItem(CLAVE)); }catch(e){}
    mapa = {};
    for(var k in POR_DEFECTO){ mapa[k] = POR_DEFECTO[k]; }
    if(guardado){ for(var k2 in guardado){ mapa[k2] = guardado[k2]; } }
  }
  cargarMapa();

  function input(idx, val){
    if(idx < 0) return;
    try{
      if(window.EJS_emulator && EJS_emulator.gameManager && EJS_emulator.gameManager.simulateInput){
        EJS_emulator.gameManager.simulateInput(0, idx, val);
      }
    }catch(e){}
  }

  BOTONES.forEach(function(par){
    var id = par[0];
    var btn = document.getElementById(id);
    if(!btn) return;
    function down(e){ e.preventDefault(); e.stopPropagation(); input(mapa[id], 1); }
    function up(e){ if(e){ e.preventDefault(); e.stopPropagation(); } input(mapa[id], 0); }
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', up);
    btn.addEventListener('touchstart', down, {passive:false});
    btn.addEventListener('touchend', up, {passive:false});
    btn.addEventListener('touchcancel', up, {passive:false});
  });

  /* ===== PANEL ===== */
  var panel = document.getElementById('map-panel');
  var lista = document.getElementById('map-list');

  function pintarPanel(){
    lista.innerHTML = "";
    BOTONES.forEach(function(par){
      var id = par[0], nombre = par[1];
      var fila = document.createElement('div');
      fila.className = "map-row";
      var et = document.createElement('span');
      et.textContent = nombre;
      var sel = document.createElement('select');
      ENTRADAS.forEach(function(op){
        var o = document.createElement('option');
        o.value = op[0]; o.textContent = op[1];
        if(mapa[id] === op[0]) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', function(){ mapa[id] = parseInt(sel.value, 10); });
      fila.appendChild(et); fila.appendChild(sel);
      lista.appendChild(fila);
    });
  }

  document.getElementById('btn-mapper').addEventListener('click', function(){
    pintarPanel();
    panel.classList.add('abierto');
  });
  document.getElementById('map-close').addEventListener('click', function(){
    panel.classList.remove('abierto');
  });
  document.getElementById('map-save').addEventListener('click', function(){
    try{ localStorage.setItem(CLAVE, JSON.stringify(mapa)); }catch(e){}
    panel.classList.remove('abierto');
  });
  document.getElementById('map-reset').addEventListener('click', function(){
    mapa = {};
    for(var k in POR_DEFECTO){ mapa[k] = POR_DEFECTO[k]; }
    try{ localStorage.removeItem(CLAVE); }catch(e){}
    pintarPanel();
  });
  document.getElementById('map-copy').addEventListener('click', function(){
    var t = document.getElementById('map-out');
    t.value = JSON.stringify(mapa);
    t.select();
    try{ document.execCommand('copy'); }catch(e){}
  });

  /* ===== BARREDOR CONTROLES NATIVOS ===== */
  (function(){
    function limpiar(){
      var wrap = document.getElementById('emulator-wrapper'); if(!wrap) return;
      var els = wrap.querySelectorAll('[class*="ejs"]');
      for (var i = 0; i < els.length; i++) {
        var c = String(els[i].className);
        if (c.indexOf('button') > -1 || c.indexOf('dpad') > -1 || c.indexOf('control') > -1 || c.indexOf('volume') > -1) {
          els[i].style.setProperty('display', 'none', 'important');
        }
      }
    }
    var n = 0, t = setInterval(function(){ limpiar(); if(++n > 30) clearInterval(t); }, 500);
  })();
</script>

</body>
</html>
