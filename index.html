<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>NEXUS - Master System</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#373737;display:flex;justify-content:center;align-items:center;
       font-family:Arial,sans-serif;overflow:hidden;user-select:none;
       -webkit-tap-highlight-color:transparent}

  /* ===== CONSOLA (siempre presente, centrada) ===== */
  #console-container{position:relative;height:100vh;width:177.78vh;
       max-width:100vw;max-height:56.25vw}
  #skin{position:absolute;top:0;left:0;width:100%;height:100%;
       z-index:1;pointer-events:none;object-fit:contain}
  #emulator-wrapper{position:absolute;left:18.31%;top:10.11%;width:63.37%;height:70.23%;
       background:#000;border-radius:4px;overflow:hidden;z-index:2}
  #emulator-wrapper canvas{width:100%!important;height:100%!important;display:block}

  /* ===== BOTONES TRANSPARENTES ===== */
  .ctrl-btn{position:absolute;z-index:100;border:none;background:transparent;
       cursor:pointer;pointer-events:auto;touch-action:none;outline:none}
  #btn-up{left:6.47%;top:20.64%;width:4.50%;height:7.92%;border-radius:20%}
  #btn-down{left:6.71%;top:36.31%;width:4.27%;height:6.39%;border-radius:20%}
  #btn-left{left:2.02%;top:28.89%;width:4.47%;height:7.14%;border-radius:20%}
  #btn-right{left:10.94%;top:29.03%;width:4.16%;height:6.17%;border-radius:20%}
  #btn-a{left:89.47%;top:36.89%;width:4.50%;height:7.11%;border-radius:50%}
  #btn-b{left:94.06%;top:28.19%;width:4.66%;height:6.56%;border-radius:50%}
  #btn-x{left:84.88%;top:28.75%;width:4.34%;height:7.25%;border-radius:50%}
  #btn-y{left:89.16%;top:20.89%;width:4.58%;height:6.83%;border-radius:50%}
  #stick-left{left:7.47%;top:57.31%;width:6.08%;height:10.03%;border-radius:50%}
  #stick-right{left:86.61%;top:56.89%;width:6.39%;height:10.44%;border-radius:50%}
  #btn-menu{left:22.58%;top:85.36%;width:4.91%;height:4.06%;border-radius:40%}
  #btn-tate{left:28.81%;top:85.36%;width:4.98%;height:3.78%;border-radius:40%}
  #btn-select{left:66.13%;top:85.64%;width:4.98%;height:3.92%;border-radius:40%}
  #btn-start{left:72.36%;top:85.50%;width:4.67%;height:3.92%;border-radius:40%}

  /* ===== PANTALLAS DE INTRO (encima de todo) ===== */
  .overlay{position:fixed;inset:0;background:#373737;z-index:9000;
       display:flex;flex-direction:column;justify-content:center;align-items:center;
       text-align:center;padding:20px}
  .overlay.oculto{display:none!important}
  .rotate-box{background:#222;border:2px solid #ff4444;border-radius:16px;
       padding:30px 40px;max-width:420px;color:#fff;
       transition:transform .3s ease}
  .rotate-icon{font-size:58px;margin-bottom:14px}
  .rotate-box p{font-size:18px;margin-bottom:20px;line-height:1.4}
  .btn-rojo{background:#ff4444;color:#000;border:none;padding:14px 34px;
       font-size:18px;font-weight:bold;border-radius:10px;cursor:pointer;
       box-shadow:0 4px 14px rgba(0,0,0,.5);transition:transform .3s ease}
  .btn-rojo:active{transform:scale(.97)}

  /* ===== FORZAR HORIZONTAL: en vertical se oculta el juego ===== */
  @media (orientation: portrait) {
    #screen-game { display: none !important; }
    .rotate-box { transform: rotate(90deg); }
    #btn-fullscreen { transform: rotate(90deg); }
  }

  /* ===== OCULTAR CONTROLES NATIVOS ===== */
  .ejs_dpad,.ejs_dpad_container,.ejs_button,.ejs_button_container,.ejs_gamepad,
  .ejs_touchControls,.ejs_controlBtn,.ejs_virtualGamepad,.ejs_volumeBtn{
       display:none!important;visibility:hidden!important;opacity:0!important;
       pointer-events:none!important;width:0!important;height:0!important}
</style>
</head>
<body>

<div id="console-container">
  <img id="skin" src="skin.png" alt="NEXUS">
  <div id="emulator-wrapper"></div>
  <button class="ctrl-btn" id="btn-up"></button>
  <button class="ctrl-btn" id="btn-down"></button>
  <button class="ctrl-btn" id="btn-left"></button>
  <button class="ctrl-btn" id="btn-right"></button>
  <button class="ctrl-btn" id="btn-a"></button>
  <button class="ctrl-btn" id="btn-b"></button>
  <button class="ctrl-btn" id="btn-x"></button>
  <button class="ctrl-btn" id="btn-y"></button>
  <button class="ctrl-btn" id="stick-left"></button>
  <button class="ctrl-btn" id="stick-right"></button>
  <button class="ctrl-btn" id="btn-menu"></button>
  <button class="ctrl-btn" id="btn-tate"></button>
  <button class="ctrl-btn" id="btn-select"></button>
  <button class="ctrl-btn" id="btn-start"></button>
</div>

<!-- Pantalla 1: Aviso de orientación -->
<div id="ov-rotate" class="overlay">
  <div class="rotate-box">
    <div class="rotate-icon">📱➡️</div>
    <p>Este juego se juega en <b>horizontal</b>.<br>Gira el dispositivo.</p>
    <button class="btn-rojo" id="btn-rotate-ok">¡Entendido!</button>
  </div>
</div>

<!-- Pantalla 2: Botón pantalla completa -->
<div id="ov-full" class="overlay oculto">
  <button class="btn-rojo" id="btn-fullscreen">⛶ PANTALLA COMPLETA</button>
</div>

<!-- Pantalla 3: Juego (solo visible en horizontal) -->
<div id="screen-game" class="overlay oculto" style="background:transparent;z-index:1"></div>

<script>
  function b64toBlob(b64){
    var bin = atob(b64.replace(/\s/g,''));
    var arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++){ arr[i]=bin.charCodeAt(i); }
    return new Blob([arr],{type:'application/octet-stream'});
  }
  var romTxt = document.getElementById('romdata').textContent.trim();
  var EJS_gameUrl = URL.createObjectURL(b64toBlob(romTxt));
  var EJS_player = "#emulator-wrapper";
  var EJS_core = "segaMS";
  var EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
  var EJS_startOnLoaded = true;
  var EJS_VirtualGamepadSettings = [];
  var EJS_defaultOptions = {"virtual-gamepad":"disabled"};
  var EJS_Buttons = {playPause:false,restart:false,mute:false,settings:false,
    fullscreen:false,saveState:false,loadState:false,screenRecord:false,
    gamepad:false,cheat:false,volume:false,saveSavFiles:false,loadSavFiles:false,
    quickSave:false,quickLoad:false,screenshot:false,menu:false};
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

<script>
  // === 1. DETECCIÓN INTELIGENTE DE ORIENTACIÓN ===
  var ovRotate = document.getElementById('ov-rotate');
  var ovFull   = document.getElementById('ov-full');
  var screenGame = document.getElementById('screen-game');
  var yaIniciado = false;

  function esHorizontal() {
    if (window.matchMedia) {
      return window.matchMedia("(orientation: landscape)").matches;
    }
    return window.innerWidth > window.innerHeight;
  }

  function actualizarPantallas() {
    // Si ya se inició el juego, no volver a mostrar la intro
    if (yaIniciado) return;
    
    if (esHorizontal()) {
      // Horizontal → saltar aviso, mostrar botón de pantalla completa
      ovRotate.classList.add('oculto');
      ovFull.classList.remove('oculto');
    } else {
      // Vertical → mostrar aviso rotado, ocultar botón y juego
      ovRotate.classList.remove('oculto');
      ovFull.classList.add('oculto');
      screenGame.classList.add('oculto');
    }
  }

  actualizarPantallas();
  window.addEventListener('resize', actualizarPantallas);
  window.addEventListener('orientationchange', function(){
    setTimeout(actualizarPantallas, 100);
  });

  document.getElementById('btn-rotate-ok').addEventListener('click', function(){
    ovRotate.classList.add('oculto');
    ovFull.classList.remove('oculto');
  });

  // === 2. BOTÓN DE PANTALLA COMPLETA ===
  document.getElementById('btn-fullscreen').addEventListener('click', function(){
    var d = document.documentElement;
    try{
      if(d.requestFullscreen) d.requestFullscreen();
      else if(d.webkitRequestFullscreen) d.webkitRequestFullscreen();
      else if(d.msRequestFullscreen) d.msRequestFullscreen();
    }catch(e){}

    if(screen.orientation && screen.orientation.lock){
      try{ screen.orientation.lock('landscape'); }catch(e){}
    }

    yaIniciado = true;
    ovFull.classList.add('oculto');
    screenGame.classList.remove('oculto');
  });

  // === 3. CONTROLES DEL EMULADOR ===
  var PAD={B:0,Y:1,SELECT:2,START:3,UP:4,DOWN:5,LEFT:6,RIGHT:7,A:8,X:9};
  var mapa={
    'btn-up':PAD.UP,'btn-down':PAD.DOWN,'btn-left':PAD.LEFT,'btn-right':PAD.RIGHT,
    'btn-a':PAD.B,'btn-b':PAD.A,'btn-x':PAD.A,'btn-y':PAD.B,
    'btn-start':PAD.START,'btn-select':PAD.SELECT,
    'btn-menu':PAD.SELECT,'btn-tate':PAD.START,
    'stick-left':PAD.UP,'stick-right':PAD.B
  };
  function input(idx,val){
    try{
      if(window.EJS_emulator && EJS_emulator.gameManager && EJS_emulator.gameManager.simulateInput){
        EJS_emulator.gameManager.simulateInput(0,idx,val);
      }
    }catch(e){}
  }
  Object.keys(mapa).forEach(function(id){
    var btn=document.getElementById(id); if(!btn) return;
    var idx=mapa[id];
    function down(e){e.preventDefault();e.stopPropagation();input(idx,1);}
    function up(e){if(e){e.preventDefault();e.stopPropagation();}input(idx,0);}
    btn.addEventListener('mousedown',down);
    btn.addEventListener('mouseup',up);
    btn.addEventListener('mouseleave',up);
    btn.addEventListener('touchstart',down,{passive:false});
    btn.addEventListener('touchend',up,{passive:false});
    btn.addEventListener('touchcancel',up,{passive:false});
  });

  // === 4. BARREDOR DE CONTROLES NATIVOS ===
  (function(){
    function limpiar(){
      var wrap=document.getElementById('emulator-wrapper'); if(!wrap) return;
      var els=wrap.querySelectorAll('[class*="ejs"]');
      for(var i=0;i<els.length;i++){
        var c=String(els[i].className);
        if(c.indexOf('button')>-1||c.indexOf('dpad')>-1||c.indexOf('control')>-1||c.indexOf('volume')>-1){
          els[i].style.setProperty('display','none','important');
        }
      }
    }
    var n=0, t=setInterval(function(){ limpiar(); if(++n>30) clearInterval(t); },500);
  })();
</script>
