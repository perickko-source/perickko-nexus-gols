<script>
  function b64toBlob(b64){
    var bin = atob(b64.replace(/\s/g,''));
    var len = bin.length;
    var arr = new Uint8Array(len);
    for(var i=0;i<len;i++){ arr[i] = bin.charCodeAt(i); }
    return new Blob([arr], {type:'application/octet-stream'});
  }
  var romTxt = document.getElementById('romdata').textContent.trim();
  var EJS_gameUrl = URL.createObjectURL(b64toBlob(romTxt));
  var EJS_player = "#emulator-wrapper";
  var EJS_core = "segaMS";
  var EJS_VirtualGamepadSettings = [];
  var EJS_defaultOptions = { "virtual-gamepad": "disabled" };
  var EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
  var EJS_startOnLoaded = true;
  var EJS_Buttons = {playPause:false,restart:false,mute:false,settings:false,
    fullscreen:false,saveState:false,loadState:false,screenRecord:false,
    gamepad:false,cheat:false,volume:false,saveSavFiles:false,loadSavFiles:false,
    quickSave:false,quickLoad:false,screenshot:false,menu:false};
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

<script>
  // Indices RetroPad estandar (Genesis Plus GX)
  var PAD = {B:0, Y:1, SELECT:2, START:3, UP:4, DOWN:5, LEFT:6, RIGHT:7, A:8, X:9};

  var mapa = {
    'btn-up':PAD.UP, 'btn-down':PAD.DOWN, 'btn-left':PAD.LEFT, 'btn-right':PAD.RIGHT,
    'btn-a':PAD.B, 'btn-b':PAD.A, 'btn-x':PAD.A, 'btn-y':PAD.B,
    'btn-start':PAD.START, 'btn-select':PAD.SELECT,
    'btn-menu':PAD.SELECT, 'btn-tate':PAD.START,
    'stick-left':PAD.UP, 'stick-right':PAD.B
  };

  function input(idx, val){
    try{
      if(window.EJS_emulator && EJS_emulator.gameManager && EJS_emulator.gameManager.simulateInput){
        EJS_emulator.gameManager.simulateInput(0, idx, val);
      }
    }catch(e){}
  }

  Object.keys(mapa).forEach(function(id){
    var btn = document.getElementById(id);
    if(!btn) return;
    var idx = mapa[id];
    function down(e){ e.preventDefault(); e.stopPropagation(); btn.classList.add('pressed'); input(idx,1); }
    function up(e){ if(e){e.preventDefault(); e.stopPropagation();} btn.classList.remove('pressed'); input(idx,0); }
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', up);
    btn.addEventListener('touchstart', down, {passive:false});
    btn.addEventListener('touchend', up, {passive:false});
    btn.addEventListener('touchcancel', up, {passive:false});
  });
</script>

<!-- === BARREDOR DE CONTROLES NATIVOS === -->
<script>
(function(){
  function limpiar(){
    var wrap = document.getElementById('emulator-wrapper');
    if(!wrap) return;
    // Recorre TODOS los elementos dentro de la pantalla
    wrap.querySelectorAll('*').forEach(function(el){
      var tag = el.tagName.toLowerCase();
      // Si no es el canvas del juego, lo ocultamos y desactivamos
      if(tag !== 'canvas' && !el.querySelector('canvas')){
        el.style.setProperty('display','none','important');
        el.style.setProperty('visibility','hidden','important');
        el.style.setProperty('pointer-events','none','important');
      }
    });
  }
  
  // Ejecutar al cargar
  limpiar();
  
  // Vigilar si el emulador intenta añadir botones nuevos dinámicamente
  var obs = new MutationObserver(limpiar);
  obs.observe(document.body, {childList:true, subtree:true});
  
  // Repasar cada medio segundo por seguridad
  setInterval(limpiar, 500);
})();
</script>
